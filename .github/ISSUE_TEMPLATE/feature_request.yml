name: Feature request
description: Suggest an idea or a new provider
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For a new provider, link its documentation about where it stores sessions and usage.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
