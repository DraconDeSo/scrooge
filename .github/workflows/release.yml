name: Release

# Push a tag like `v0.2.0` to build installers for every OS, sign the update
# packages and publish them (plus `latest.json` for the in-app updater) to a
# draft GitHub Release. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign_platform:
        description: Verify with Windows Authenticode and macOS Developer ID
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check updater key and tag
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Configure TAURI_SIGNING_PRIVATE_KEY to sign the updater bundles."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(node -p "require('./package.json').version")
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::The tag must match the version in package.json."
              exit 1
            fi
          fi
      - name: Check platform signing credentials
        if: github.ref_type == 'tag' || inputs.sign_platform
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          failed=0
          for secret in WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing platform signing secret $secret"
              failed=1
            fi
          done
          exit "$failed"

  build:
    name: Build (${{ matrix.name }})
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend tooling
        run: npm ci

      - name: Configure Windows certificate
        if: runner.os == 'Windows' && (github.ref_type == 'tag' || inputs.sign_platform)
        id: windows-signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'scrooge-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password |
              Where-Object HasPrivateKey | Select-Object -First 1
            if (!$certificate) { throw 'The Windows certificate has no private key.' }
            $config = Join-Path $env:RUNNER_TEMP 'scrooge-signing.json'
            @{
              bundle = @{ windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
                tsp = $true
              } }
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $config -Encoding utf8
            $configPath = $config.Replace('\', '/')
            "args=--config `"$configPath`"" >> $env:GITHUB_OUTPUT
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx }
          }

      - name: Build, sign and upload
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update-signing key (see docs/releasing.md). Required.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && (github.ref_type == 'tag' || inputs.sign_platform) && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && (github.ref_type == 'tag' || inputs.sign_platform) && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && (github.ref_type == 'tag' || inputs.sign_platform) && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && (github.ref_type == 'tag' || inputs.sign_platform) && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && (github.ref_type == 'tag' || inputs.sign_platform) && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && (github.ref_type == 'tag' || inputs.sign_platform) && secrets.APPLE_TEAM_ID || '' }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Scrooge {0}', github.ref_name) || '' }}
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed.

            | System | File |
            | --- | --- |
            | Windows 10/11 (x64) | `Scrooge_*_x64-setup.exe` (recommended) or `.msi` |
            | macOS Apple silicon | `Scrooge_*_aarch64.dmg` |
            | macOS Intel | `Scrooge_*_x64.dmg` |
            | Linux (Debian/Ubuntu) | `.deb` |
            | Linux (Fedora/openSUSE) | `.rpm` |
            | Linux (any) | `.AppImage` |

            Installed copies update themselves from this release.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: ${{ github.ref_type == 'tag' }}
          args: --target ${{ matrix.target }} ${{ steps.windows-signing.outputs.args }}

      - name: Verify Authenticode
        if: runner.os == 'Windows' && (github.ref_type == 'tag' || inputs.sign_platform)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath 'target/${{ matrix.target }}/release/bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' })
          if (!$installers.Count) { throw 'No Windows installers found.' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate) {
              throw "Invalid or untimestamped signature for $($installer.Name)."
            }
          }

      - name: Verify Developer ID and notarization
        if: runner.os == 'macOS' && (github.ref_type == 'tag' || inputs.sign_platform)
        run: |
          app='target/${{ matrix.target }}/release/bundle/macos/Scrooge.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute "$app"

      - name: Upload verification bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scrooge-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.sig
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify installers and updater signatures
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scrooge-*
          path: ${{ runner.temp }}/scrooge-bundles
      - name: Install minisign
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y minisign
      - name: Check all bundle types and verify signatures against the app key
        env:
          BUNDLES: ${{ runner.temp }}/scrooge-bundles
        run: node scripts/verify-installers.mjs "$BUNDLES"
