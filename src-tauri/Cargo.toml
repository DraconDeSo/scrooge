[package]
name = "scrooge"
version = "0.1.0"
edition = "2021"
description = "Desktop widget monitor for AI coding agents (Claude Code, Codex, OpenCode, GitHub Copilot)"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
abtop = { path = "../crates/abtop" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ureq = { version = "2", features = ["json"] }
chrono = "0.4"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
