[package]
name = "scrooge"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Desktop widget monitor for AI coding agents (Claude Code, Codex, OpenCode, GitHub Copilot)"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
abtop = { path = "../crates/abtop" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"
ureq = { version = "3.5.1", features = ["json"] }
chrono = "0.4.45"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-updater = "2.14.1"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = { path = "../vendor/glib-0.18.5" }
