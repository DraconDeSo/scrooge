name: scrooge
base: core22
version: '0.1.1'
summary: Desktop monitor for AI coding agents
description: |
  Scrooge shows every AI coding agent running on your machine (Claude Code,
  Codex CLI, OpenCode, GitHub Copilot, Gemini CLI, Grok Build): sessions,
  read/written/cached tokens, context windows and quotas.
grade: stable
confinement: classic

apps:
  scrooge:
    command: usr/bin/scrooge
    desktop: usr/share/applications/Scrooge.desktop

parts:
  scrooge:
    plugin: dump
    source: https://github.com/DraconDeSo/scrooge/releases/download/v0.1.1/Scrooge_0.1.1_amd64.deb
    source-type: deb
    source-checksum: sha256/955b16e821c79d5c6206f93ae02e151ec6afc3928adcfcfba053bbb22c0a9b51
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
